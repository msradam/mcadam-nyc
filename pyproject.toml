[project]
name = "mcadam"
version = "0.0.1"
description = "Mcadam — local-first natural-language pedestrian routing for NYC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Adam Munawar Rahman", email = "msrahmanadam@gmail.com" }]

dependencies = [
  "networkx>=3.4",
  "ijson>=3.3",
  "click>=8.1",
  "rich>=13.7",
  "scipy>=1.13",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcadam = "cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]
